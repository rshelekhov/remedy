# Docker Compose for Remedy Integration Tests
# This setup runs the SSO server and required dependencies for testing

services:
  # PostgreSQL for Remedy service (test database)
  postgres-test:
    image: postgres:16
    container_name: remedy-postgres-test
    environment:
      POSTGRES_USER: remedy_test
      POSTGRES_PASSWORD: remedy_test
      POSTGRES_DB: remedy_test
    ports:
      - "5434:5432"  # Different from dev (5433)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remedy_test -d remedy_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - remedy-test-network

  # PostgreSQL for SSO service (named "postgres" for SSO test-entrypoint.sh script)
  postgres:
    image: postgres:16-alpine
    container_name: remedy-postgres-sso-test
    environment:
      POSTGRES_DB: sso_db
      POSTGRES_USER: sso_user
      POSTGRES_PASSWORD: sso_password
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sso -d sso"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_sso_data:/var/lib/postgresql/data
    networks:
      - remedy-test-network

  # Redis Cache for SSO sessions
  redis:
    image: redis:7-alpine
    container_name: remedy-redis-test
    ports:
      - "6380:6379"  # Different from default 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - remedy-test-network

  # MinIO (S3-compatible storage for JWT keys and remedy files)
  minio:
    image: minio/minio:latest
    container_name: remedy-minio-test
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9001:9000"    # API port (different from default 9000)
      - "9091:9001"    # Console port
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - minio_test_data:/data
    networks:
      - remedy-test-network

  # MinIO initialization - creates buckets and uploads test keys
  # Uses SSO image which contains test keys in /src/certs
  minio-init:
    image: rshelekhov/grpc-sso:v0.3.2
    container_name: remedy-minio-init
    depends_on:
      minio:
        condition: service_healthy
    command: >
      sh -c "
        apk add --no-cache curl &&
        wget -O /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc &&
        chmod +x /usr/local/bin/mc &&
        echo 'Configuring MinIO client...' &&
        mc alias set local http://minio:9000 minio_user minio_password &&
        echo 'Creating SSO bucket...' &&
        mc mb local/sso --ignore-existing &&
        echo 'Creating remedy bucket...' &&
        mc mb local/remedy --ignore-existing &&
        echo 'Setting bucket policies...' &&
        mc anonymous set none local/sso &&
        mc anonymous set none local/remedy &&
        echo 'Uploading test JWT keys...' &&
        if [ -f /src/certs/app_test-client-id_private.pem ]; then
          mc cp /src/certs/app_test-client-id_private.pem local/sso/keys/app_test-client-id_private.pem &&
          echo 'Test JWT key uploaded successfully!';
        else
          echo 'Warning: No test key found in /src/certs';
        fi &&
        echo 'MinIO initialization complete!'
      "
    restart: "no"
    networks:
      - remedy-test-network

  # SSO Server
  sso:
    image: rshelekhov/grpc-sso:v0.3.2
    container_name: remedy-sso-test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      CONFIG_PATH: /app/config.yaml
      RUN_TESTS: "false"  # Setup DB and start server, don't run Go tests
    volumes:
      - ./config/sso-config.yaml:/app/config.yaml:ro
    ports:
      - "8081:8080"   # HTTP/REST API (different from default 8080)
      - "44045:44044" # gRPC (different from default 44044)
    command: /usr/local/bin/test-entrypoint.sh
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "44044"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - remedy-test-network

  # Remedy Application
  remedy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: remedy-app-test
    depends_on:
      postgres-test:
        condition: service_healthy
      sso:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: test
      PORT: 3001
      SKIP_DOTENV_LOAD: "true"  # Use Docker env vars, don't load .env files
      DATABASE_URL: postgresql://remedy_test:remedy_test@postgres-test:5432/remedy_test
      SSO_CLIENT_ID: test-client-id
      SSO_API_URL: http://sso:8080
      SSO_EMAIL_VERIFICATION_URL: http://remedy:3001/verify-email
      SSO_PASSWORD_RESET_URL: http://remedy:3001/reset-password
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: remedy
      S3_ACCESS_KEY: minio_user
      S3_SECRET_KEY: minio_password
    volumes:
      - ./src:/app/src:ro  # Mount source for hot reload (read-only)
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - remedy-test-network
    restart: unless-stopped

  # Test Runner - runs integration tests in Docker
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: remedy-test-runner
    depends_on:
      remedy:
        condition: service_healthy
      postgres-test:
        condition: service_healthy
      sso:
        condition: service_healthy
    environment:
      NODE_ENV: test
      PORT: 3001
      SKIP_DOTENV_LOAD: "true"  # Use Docker env vars, don't load .env files
      REMEDY_HOST: remedy  # Tell test client to use Docker service name
      DATABASE_URL: postgresql://remedy_test:remedy_test@postgres-test:5432/remedy_test
      SSO_CLIENT_ID: test-client-id
      SSO_API_URL: http://sso:8080
      SSO_EMAIL_VERIFICATION_URL: http://remedy:3001/verify-email
      SSO_PASSWORD_RESET_URL: http://remedy:3001/reset-password
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: remedy
      S3_ACCESS_KEY: minio_user
      S3_SECRET_KEY: minio_password
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    networks:
      - remedy-test-network
    profiles:
      - test  # Only start when explicitly requested
    command: bun test tests/integration

networks:
  remedy-test-network:
    driver: bridge

volumes:
  postgres_test_data:
  postgres_sso_data:
  minio_test_data:
